schemaVersion: training_profile.v1
name: foundation_bootstrap_v1
description: >
  teacher / 現行 champion を足場にした foundation lane。hardcase 採掘と再学習を一体で回す。
runTagPrefix: foundation_bootstrap_v1
launcherScript: scripts/run-foundation-bootstrap.js
paths:
  runsDir: data/runs/foundation_bootstrap_v1
  modelsDir: data/models/foundation_bootstrap_v1
bootstrap:
  sourcePolicyTable: data/models/policy-table.json
  sourceOnnxModel: data/models/policy-net.onnx
  sourceOnnxMeta: data/models/policy-net.onnx.meta.json
  copyPromotedPolicyTable: true
  copyPromotedOnnxModel: true
  copyPromotedOnnxMeta: true
  useCopiedPolicyTableAsBootstrap: true
  autoResumeLatestCheckpoint: true
preflight:
  enabled: true
  strict: false
  allowArtifacts: true
  checkWindow: true
trainCycleArgs:
  - --train-games
  - "12000"
  - --eval-games
  - "2400"
  - --selfplay-jobs
  - "6"
  - --seed
  - "1"
  - --eval-seed-offset
  - "100000"
  - --max-plies
  - "220"
  - --with-cards
  - --card-usage-rate
  - "0.62"
  - --selfplay-policy-mix-rate
  - "0.75"
  - --selfplay-policy-pool-sampling
  - recency
  - --selfplay-policy-pool-recency-decay
  - "2.0"
  - --selfplay-policy-current-anchor-rate
  - "0.35"
  - --selfplay-card-usage-rate-jitter
  - "0.12"
  - --selfplay-tactical-weight-min
  - "0.90"
  - --selfplay-tactical-weight-max
  - "1.50"
  - --selfplay-tactical-depth-opening
  - "4"
  - --selfplay-tactical-depth-mid
  - "6"
  - --selfplay-tactical-depth-end
  - "8"
  - --selfplay-tactical-beam-width
  - "10"
  - --selfplay-teacher-committee-weight-min
  - "42"
  - --selfplay-teacher-committee-weight-max
  - "62"
  - --selfplay-teacher-committee-consensus-bonus-min
  - "520"
  - --selfplay-teacher-committee-consensus-bonus-max
  - "900"
  - --onnx-epochs
  - "400"
  - --onnx-batch-size
  - "1024"
