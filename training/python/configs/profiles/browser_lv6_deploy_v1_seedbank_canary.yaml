description: >
  browser Lv6 deploy 用の seed bank canary レーン。quick-only gate の speed は維持しつつ、
  昇格済みモデルだけを自己対局 guide に使って drift を抑え、固定 anchor baseline 比較で改善量を見る。
runTagPrefix: browser_lv6_deploy_v1_seedbank_canary
