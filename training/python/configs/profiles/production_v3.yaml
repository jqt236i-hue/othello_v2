schemaVersion: training_profile.v1
name: production_v3
description: >
  自己対局主役の本番主線。昇格済み guide を固定しつつ、
  promotion_v3 で大きな退行を防ぎながら champion 昇格を狙う。
runTagPrefix: production_v3
gateProfile: promotion_v3
syncCpuLv6SharedTeacher: true
paths:
  runsDir: data/runs/production_v3
  modelsDir: data/models/production_v3
bootstrap:
  sourcePolicyTable: data/models/policy-table.json
  sourceOnnxModel: data/models/policy-net.onnx
  sourceOnnxMeta: data/models/policy-net.onnx.meta.json
  copyPromotedPolicyTable: true
  copyPromotedOnnxModel: true
  copyPromotedOnnxMeta: true
  useCopiedPolicyTableAsBootstrap: true
  autoResumeLatestCheckpoint: true
preflight:
  enabled: true
  strict: false
  allowArtifacts: true
  checkWindow: true
trainCycleArgs:
  - --iterations
  - "999"
  - --max-hours
  - "100"
  - --train-games
  - "10000"
  - --eval-games
  - "2400"
  - --selfplay-jobs
  - "8"
  - --adoption-jobs
  - "8"
  - --onnx-gate-jobs
  - "8"
  - --seed
  - "1"
  - --max-plies
  - "220"
  - --with-cards
  - --train-card-every
  - "0"
  - --no-train-target-head
  - --card-usage-rate
  - "0.60"
  - --selfplay-policy-mix-rate
  - "1.0"
  - --selfplay-policy-model-pool-size
  - "4"
  - --selfplay-policy-pool-sampling
  - recency
  - --selfplay-policy-pool-recency-decay
