<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6a43"/>
      <stop offset="0.55" stop-color="#0f4f32"/>
      <stop offset="1" stop-color="#0a3324"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fff3bf" stop-opacity="0.18"/>
      <stop offset="0.52" stop-color="#7dd3a0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#06170f" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#felt)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.55"/>
  <g opacity="0.18" stroke="#f8e7b2" stroke-width="2" fill="none">
    <rect x="120" y="92" width="1680" height="896" rx="36"/>
    <rect x="174" y="146" width="1572" height="788" rx="28"/>
  </g>
</svg>
