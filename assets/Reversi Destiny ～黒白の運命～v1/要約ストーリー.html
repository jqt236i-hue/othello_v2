<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Reversi Destiny ～黒白の運命～｜要約ストーリー</title>
  <style>
    :root {
      --bg: #08090b;
      --surface: #111318;
      --line: #343943;
      --line-soft: #242831;
      --text: #f3f1eb;
      --muted: #a9adb5;
      --gold: #d9b85f;
      --gold-soft: rgba(217, 184, 95, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background:
        radial-gradient(circle at 14% -4%, rgba(217, 184, 95, 0.09), transparent 28rem),
        var(--bg);
      font-family: "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 1.0625rem;
      line-height: 1.95;
    }

    .page-shell {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 64px 0 96px;
    }

    .page-header {
      padding-bottom: 28px;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
    }

    h1 {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0.03em;
    }

    /* 章ごとの見出しと本文。章を足すときは <section class="chapter"> を story の中に追加する。 */
    .chapter {
      padding: 28px 0;
      border-top: 1px solid var(--line-soft);
    }

    .chapter:first-child {
      border-top: 0;
    }

    .chapter-label {
      margin: 0 0 6px;
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
    }

    h2 {
      margin: 0 0 16px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .chapter p {
      margin: 0 0 1.2em;
    }

    .note {
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--gold);
      border-radius: 0 var(--radius) var(--radius) 0;
      background: var(--gold-soft);
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.7;
    }

    @media (max-width: 520px) {
      .page-shell {
        padding: 40px 0 72px;
      }

      body {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <p class="eyebrow">STORY SUMMARY</p>
      <h1>Reversi Destiny ～黒白の運命～　要約ストーリー</h1>
    </header>

    <main id="story">
      <!--
        章の追加例:
        <section class="chapter">
          <p class="chapter-label">第1章</p>
          <h2>章タイトル</h2>
          <p>本文</p>
        </section>
      -->
    </main>
  </div>
</body>
</html>
