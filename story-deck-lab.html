<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自由デッキ構築</title>
  <link rel="stylesheet" href="styles-variables.css">
  <link rel="stylesheet" href="styles-base.css">
  <link rel="stylesheet" href="styles-layout.css">
  <link rel="stylesheet" href="styles-cards.css">
  <link rel="stylesheet" href="styles-responsive.css">
  <link rel="stylesheet" href="styles-story-deck-lab.css">
</head>
<body class="story-deck-lab-page-body">
  <div id="deckBuilderOverlay" class="is-open story-deck-lab-standalone" aria-hidden="false">
    <div id="deckBuilderModal" role="dialog" aria-modal="true" aria-label="自由デッキ構築">
      <div id="deckBuilderModalHeader">
        <div class="deck-builder-title-wrap">
          <div class="deck-builder-title">自由デッキ構築</div>
          <div id="storyDeckHeaderSummary"></div>
        </div>
        <button id="deckBuilderCloseBtn" class="btn-small" type="button" aria-label="自由デッキ構築を閉じる">×</button>
      </div>

      <div id="deckBuilderBody">
        <div class="deck-builder-effective-summary">
          ストーリー用の author page です。通常の deckCode とは別の storyDeckCode を生成します。
        </div>

        <div class="story-deck-lab-toolbar">
          <label class="story-deck-lab-field">
            <span class="story-deck-lab-field-label">ルールセット</span>
            <select id="storyDeckRuleSet" class="story-deck-lab-select">
              <option value="free30">自由30 / 同一カード上限なし</option>
              <option value="unique30">ユニーク30 / 同一カード1枚まで</option>
            </select>
          </label>

          <label class="story-deck-lab-field">
            <span class="story-deck-lab-field-label">カード検索</span>
            <input id="storyDeckSearch" class="story-deck-lab-input" type="search" placeholder="カード名 / ID / 効果文で検索">
          </label>

          <div class="deck-builder-actions-row">
            <button id="storyDeckClearBtn" class="btn-small" type="button">全消去</button>
            <button id="storyDeckImportBtn" class="btn-small" type="button">コード反映</button>
            <button id="storyDeckCopyBtn" class="btn-small" type="button">コードコピー</button>
          </div>
        </div>

        <div id="storyDeckSummary" class="deck-builder-effective-summary"></div>
        <div id="storyDeckNotice" class="deck-builder-notice" aria-live="polite"></div>

        <div class="deck-builder-code-block">
          <div class="deck-builder-section-title">storyDeckCode</div>
          <textarea id="storyDeckCode" class="deck-builder-code-input story-deck-lab-code-input" spellcheck="false"></textarea>
        </div>

        <div class="deck-builder-section">
          <div class="deck-builder-section-title">選択中カード</div>
          <div id="storyDeckSelectedCountLabel" class="deck-builder-editor-summary"></div>
          <div id="storyDeckSelectedCards" class="deck-builder-card-grid"></div>
        </div>

        <div class="deck-builder-section">
          <div class="deck-builder-section-title">候補カード</div>
          <div id="storyDeckCandidateCountLabel" class="deck-builder-editor-summary"></div>
          <div id="storyDeckCandidateCards" class="deck-builder-card-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="cards/catalog.generated.js"></script>
  <script src="shared-constants.js"></script>
  <script src="cards/card-renderer.js"></script>
  <script src="shared/story-deck-spec.js"></script>
  <script src="shared/story-deck-codec.js"></script>
  <script src="ui/story-deck-lab/story-deck-lab-state.js"></script>
  <script src="ui/story-deck-lab/story-deck-lab-renderer.js"></script>
  <script src="ui/story-deck-lab/story-deck-lab-controller.js"></script>
  <script>
    StoryDeckLabControllerModule.bootstrap({
      root: window,
      refs: {
        headerSummary: document.getElementById('storyDeckHeaderSummary'),
        closeBtn: document.getElementById('deckBuilderCloseBtn'),
        ruleSetSelect: document.getElementById('storyDeckRuleSet'),
        searchInput: document.getElementById('storyDeckSearch'),
        summary: document.getElementById('storyDeckSummary'),
        notice: document.getElementById('storyDeckNotice'),
        codeTextarea: document.getElementById('storyDeckCode'),
        clearBtn: document.getElementById('storyDeckClearBtn'),
        importBtn: document.getElementById('storyDeckImportBtn'),
        copyBtn: document.getElementById('storyDeckCopyBtn'),
        selectedCountLabel: document.getElementById('storyDeckSelectedCountLabel'),
        candidateCountLabel: document.getElementById('storyDeckCandidateCountLabel'),
        selectedCards: document.getElementById('storyDeckSelectedCards'),
        candidateCards: document.getElementById('storyDeckCandidateCards')
      }
    });
  </script>
</body>
</html>
