schemaVersion: training_profile.v1
name: browser_lv6_growth_final5_v1
description: >
  ブラウザLv6強化の final-5-seed 比較レーン。deploy 用の promoted-only 主線とは分離し、
  root deploy からは bootstrap だけ取り込みつつ candidate を毎 iteration 継続学習する。
  tactical selfplay は browser_lv6_growth_v1 と揃え、gate だけ final 5 seed に振って比較する。
runTagPrefix: browser_lv6_growth_final5_v1
gateProfile: browser_lv6_growth_final5_v1
syncCpuLv6SharedTeacher: false
paths:
  runsDir: data/runs/browser_lv6_growth_final5_v1
  modelsDir: data/models/browser_lv6_growth_final5_v1
bootstrap:
  sourcePolicyTable: data/models/policy-table.json
  sourceOnnxModel: data/models/policy-net.onnx
  sourceOnnxMeta: data/models/policy-net.onnx.meta.json
  copyPromotedPolicyTable: true
  copyPromotedOnnxModel: true
  copyPromotedOnnxMeta: true
  useCopiedPolicyTableAsBootstrap: true
  autoResumeLatestCheckpoint: true
preflight:
  enabled: true
  strict: false
  allowArtifacts: true
  checkWindow: true
