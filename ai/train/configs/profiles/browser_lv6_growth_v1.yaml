schemaVersion: training_profile.v1
name: browser_lv6_growth_v1
description: >
  ブラウザLv6の累積成長レーン。deploy 用の promoted-only 主線とは分離し、
  root deploy からは bootstrap だけ取り込みつつ quality gate 通過 candidate だけを継続学習に入れる。
  厳しい browser non-regression 判定は deploy レーン側に任せ、このレーンでは
  staged card exposure の tactical selfplay と fixed deploy anchor 比較で raw strength を積み上げる。
runTagPrefix: browser_lv6_growth_v1
gateProfile: browser_lv6_growth_v1
syncCpuLv6SharedTeacher: false
paths:
  runsDir: data/runs/browser_lv6_growth_v1
  modelsDir: data/models/browser_lv6_growth_v1
bootstrap:
  sourcePolicyTable: data/models/policy-table.json
  sourceOnnxModel: data/models/policy-net.onnx
  sourceOnnxMeta: data/models/policy-net.onnx.meta.json
  copyPromotedPolicyTable: true
  copyPromotedOnnxModel: true
  copyPromotedOnnxMeta: true
  useCopiedPolicyTableAsBootstrap: true
  autoResumeLatestCheckpoint: false
preflight:
  enabled: true
  strict: false
  allowArtifacts: true
  checkWindow: true
trainCycleArgs:
